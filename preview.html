<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魚店怪盜：喵喵行動</title>

<style>
body{
    margin:0;
    background:#f8f3e6;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:10px;
}

#ui{
    font-size:24px;
    margin-bottom:10px;
}

canvas{
    background:white;
    border:4px solid #333;
    border-radius:12px;
}

#message{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>
<body>

<h1>🐱 魚店怪盜：喵喵行動</h1>

<div id="ui">
❤️ <span id="lives">3</span>
&nbsp;&nbsp;
🐟 <span id="score">0</span>
</div>

<canvas id="game" width="600" height="400"></canvas>

<div id="message"></div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let score = 0;
let lives = 3;
let gameOver = false;

const cat = {
    x:100,
    y:100,
    size:30,
    speed:5
};

const owner = {
    x:500,
    y:250,
    size:35,
    speed:1.8
};

let fish = spawnFish();

function spawnFish(){
    return {
        x:Math.random()*550 + 20,
        y:Math.random()*350 + 20,
        size:20
    };
}

const keys = {};

document.addEventListener("keydown",(e)=>{
    keys[e.key]=true;

    if(gameOver && e.key==="r"){
        restart();
    }
});

document.addEventListener("keyup",(e)=>{
    keys[e.key]=false;
});

function update(){

    if(gameOver) return;

    if(keys["ArrowLeft"]) cat.x -= cat.speed;
    if(keys["ArrowRight"]) cat.x += cat.speed;
    if(keys["ArrowUp"]) cat.y -= cat.speed;
    if(keys["ArrowDown"]) cat.y += cat.speed;

    cat.x = Math.max(0,Math.min(canvas.width-cat.size,cat.x));
    cat.y = Math.max(0,Math.min(canvas.height-cat.size,cat.y));

    // 老闆追蹤
    let dx = cat.x - owner.x;
    let dy = cat.y - owner.y;
    let dist = Math.hypot(dx,dy);

    if(dist > 0){
        owner.x += dx/dist * owner.speed;
        owner.y += dy/dist * owner.speed;
    }

    // 吃魚
    if(
        Math.abs(cat.x - fish.x) < 25 &&
        Math.abs(cat.y - fish.y) < 25
    ){
        score++;
        fish = spawnFish();

        document.getElementById("score").textContent = score;
    }

    // 撞到老闆
    if(
        Math.abs(cat.x - owner.x) < 25 &&
        Math.abs(cat.y - owner.y) < 25
    ){
        lives--;

        document.getElementById("lives").textContent = lives;

        cat.x = 50;
        cat.y = 50;

        owner.x = 500;
        owner.y = 250;

        if(lives <= 0){
            gameOver = true;

            document.getElementById("message").innerHTML =
            `😾 被抓到了！<br>總共偷了 ${score} 條魚<br><br>按 R 重新開始`;
        }
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // 魚
    ctx.font="24px Arial";
    ctx.fillText("🐟",fish.x,fish.y);

    // 貓
    ctx.font="32px Arial";
    ctx.fillText("🐱",cat.x,cat.y);

    // 老闆
    ctx.font="34px Arial";
    ctx.fillText("👨‍🍳",owner.x,owner.y);
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function restart(){

    score = 0;
    lives = 3;
    gameOver = false;

    cat.x = 100;
    cat.y = 100;

    owner.x = 500;
    owner.y = 250;

    fish = spawnFish();

    document.getElementById("score").textContent = score;
    document.getElementById("lives").textContent = lives;
    document.getElementById("message").textContent = "";
}

gameLoop();

</script>

</body>
</html>
